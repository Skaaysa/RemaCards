<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RemaCards Admin</title>

<link rel="stylesheet" href="css/style.css">


<style>

body{
background:#000;
}


.admin-container{

width:500px;
max-width:90%;
margin:40px auto;
background:#151515;
padding:30px;
border-radius:15px;

}


h1,h2{

text-align:center;
color:#ffd600;

}


label{

color:white;
font-weight:bold;

}


input{

width:100%;
box-sizing:border-box;
padding:12px;
margin:10px 0;

background:#222;
color:white;

border:0;
border-radius:10px;

}



button{

padding:10px 18px;
border:0;
border-radius:20px;
cursor:pointer;
font-weight:bold;

}



.guardar{

background:#00c853;
color:white;
width:100%;

}


.logout{

background:#ffd600;

}


.estadisticas{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}


.stat{

background:#151515;
border:1px solid #333;
padding:15px;
border-radius:15px;
color:white;

}



#buscador{

display:block;
width:350px;
max-width:90%;
margin:20px auto;

}



.admin-carta{

display:flex;
gap:25px;
align-items:center;

background:#151515;

border:1px solid #333;

border-radius:15px;

padding:20px;

margin:20px;

color:white;

}


.admin-carta img{

width:120px;
height:160px;
object-fit:contain;

}



.info h3{

color:#ffd600;

}


.estado{

background:#ffd600;

}



.editar{

background:#2196f3;
color:white;

}


.eliminar{

background:red;
color:white;

}


</style>


</head>



<body>



<script>

if(localStorage.getItem("admin")!=="true"){

window.location.href="login.html";

}

</script>




<header>

<h1>RemaCards Admin</h1>


<button class="logout" onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>


</header>







<div class="admin-container">


<h2>➕ Nueva carta</h2>



<label>Jugador</label>
<input id="jugador">



<label>Equipo</label>
<input id="equipo">



<label>Colección</label>
<input id="coleccion">



<label>Temporada</label>
<input id="temporada">



<label>Precio</label>
<input id="precio" type="number">



<label>Imagen</label>
<input id="imagen" type="file">





<button class="guardar" onclick="guardarCarta()">

💾 Guardar carta

</button>


</div>








<h2>📦 Inventario</h2>



<div class="estadisticas">

<div class="stat" id="total"></div>

<div class="stat" id="disp"></div>

<div class="stat" id="reserv"></div>

<div class="stat" id="vend"></div>

<div class="stat" id="valor"></div>

</div>





<input id="buscador" placeholder="🔎 Buscar carta" onkeyup="buscar()">





<div id="lista"></div>









<script>


let cartas=[];





function guardarCarta(){


let datos=new FormData();



datos.append("jugador",jugador.value);

datos.append("equipo",equipo.value);

datos.append("coleccion",coleccion.value);

datos.append("temporada",temporada.value);

datos.append("precio",precio.value);

datos.append("imagen",imagen.files[0]);





fetch("/api/cartas",{

method:"POST",

body:datos

})

.then(()=>location.reload());



}







function cargar(){


fetch("/api/cartas")

.then(r=>r.json())

.then(data=>{


cartas=data.reverse();


mostrar(cartas);


stats(cartas);



});


}









function mostrar(lista){


listaDiv="";



lista.forEach(c=>{


listaDiv+=`


<div class="admin-carta">


<img src="img/cartas/${c.imagen}">



<div class="info">


<h3>${c.jugador}</h3>


<p>⚽ ${c.equipo}</p>


<p>🏆 ${c.coleccion}</p>


<p>💰 ${c.precio} €</p>


<p>📅 ${c.fecha || "Sin fecha"}</p>


<p>${c.estado}</p>



<button class="estado" onclick="estado(${c.id})">

🔄 Estado

</button>



<button class="editar" onclick="editar(${c.id})">

✏️ Editar

</button>



<button class="eliminar" onclick="borrar(${c.id})">

🗑️ Borrar

</button>



</div>


</div>


`;



});



document.getElementById("lista").innerHTML=listaDiv;


}









function stats(lista){


total.innerHTML="📦 "+lista.length;


disp.innerHTML="🟢 "+
lista.filter(x=>x.estado==="Disponible").length;


reserv.innerHTML="🟡 "+
lista.filter(x=>x.estado==="Reservada").length;


vend.innerHTML="🔴 "+
lista.filter(x=>x.estado==="Vendida").length;


valor.innerHTML="💰 "+
lista.reduce((a,b)=>a+b.precio,0)+"€";


}








function buscar(){


let t=buscador.value.toLowerCase();



mostrar(

cartas.filter(c=>

c.jugador.toLowerCase().includes(t)||

c.equipo.toLowerCase().includes(t)||

c.coleccion.toLowerCase().includes(t)

)

);



}








function estado(id){


fetch("/api/cartas/"+id,{

method:"PUT"

})

.then(()=>cargar());


}







function borrar(id){


if(confirm("¿Eliminar carta?")){


fetch("/api/cartas/"+id,{

method:"DELETE"

})

.then(()=>cargar());


}


}








function editar(id){


let c=cartas.find(x=>x.id==id);



let nombre=prompt("Jugador:",c.jugador);



if(nombre==null)return;



fetch("/api/cartas/editar/"+id,{

method:"PUT",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

jugador:nombre,

equipo:c.equipo,

coleccion:c.coleccion,

temporada:c.temporada,

precio:c.precio,

imagen:c.imagen


})


})

.then(()=>cargar());


}








function cerrarSesion(){


localStorage.removeItem("admin");


window.location.href="login.html";


}






cargar();



</script>



</body>

</html>
