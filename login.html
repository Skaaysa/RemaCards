<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RemaCards Login</title>

<link rel="stylesheet" href="css/style.css">


<style>

.login-box{

width:400px;

max-width:90%;

margin:80px auto;

background:#151515;

border:1px solid #333;

border-radius:20px;

padding:40px;

text-align:center;

}



.login-box h2{

color:#ffd700;

margin-bottom:30px;

}



.login-box input{

width:100%;

padding:15px;

margin:10px 0;

background:#222;

border:none;

border-radius:10px;

color:white;

}



.login-box button{

width:100%;

padding:15px;

margin-top:20px;

background:#ffd700;

border:none;

border-radius:20px;

font-weight:bold;

cursor:pointer;

}



.error{

color:red;

margin-top:15px;

display:none;

}



</style>


</head>



<body>



<header>


<img src="img/logo/RemaCards_logo_Wallapop.jpg" class="logo">


<h1>RemaCards</h1>


<p>Panel privado</p>


</header>







<div class="login-box">


<h2>🔒 Administrador</h2>



<input 
id="usuario"
placeholder="Usuario"
>



<input 
id="password"
type="password"
placeholder="Contraseña"
>



<button onclick="login()">

Entrar

</button>



<p id="error" class="error">

Usuario o contraseña incorrectos

</p>



</div>







<script>


function login(){


let user = document.getElementById("usuario").value;


let pass = document.getElementById("password").value;





if(user==="admin" && pass==="remacards"){



localStorage.setItem(
"admin",
"true"
);



window.location.href="admin.html";



}else{


document.getElementById("error").style.display="block";


}



}



</script>




</body>

</html>
