<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemaCards | Cartas Adrenalyn XL Oficiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  /* ===== HEADER ===== */
  header {
    background: #000;
    border-bottom: 1px solid #1a1a1a;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: #00ff88; }

  nav {
    display: flex;
    gap: 26px;
  }
  nav a {
    color: #bbb;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: color 0.2s;
  }
  nav a:hover, nav a.active { color: #fff; }

  .icons {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .icons svg {
    width: 21px;
    height: 21px;
    cursor: pointer;
    opacity: 0.9;
  }
  .cart-wrap { position: relative; }
  .cart-count {
    position: absolute;
    top: -7px;
    right: -9px;
    background: #00ff88;
    color: #000;
    font-size: 11px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== HERO ===== */
  .hero {
    text-align: center;
    padding: 48px 20px 20px;
  }
  .hero h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .hero h1 span { color: #00ff88; }
  .hero p {
    color: #999;
    margin-top: 8px;
    font-size: 14.5px;
  }
